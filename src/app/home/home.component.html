<div class="holder" *ngIf="content">
    <div class="titlett">{{ content.title }}</div>
    <div>{{ content.intro }}</div>
    <div
      *ngFor="let project of content.projects"
      [class.aclass]="project.visible"
      [class.bclass]="!project.visible"
    >
        {{ project.date }}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<div class="arrow">→</div>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Go to&nbsp;
        <a *ngIf="project.routerLink" [routerLink]="project.routerLink">{{ project.linkText }}</a>
        <a *ngIf="project.href" [href]="project.href">{{ project.linkText }}</a>
    </div>
</div>
